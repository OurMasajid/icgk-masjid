<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past Events — Islamic Community of Greater Killeen</title>
<meta name="description" content="Archive of past events at the Islamic Community of Greater Killeen (ICGK) — fundraisers, programs, and community gatherings.">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-config.js"></script>
<style type="text/tailwindcss">
  @layer base {
    a { @apply text-icgk-gold-bright; }
  }
  @layer components {
    .btn {
      @apply inline-flex items-center gap-2 px-6 py-3 m-1.5 rounded-full no-underline text-base font-bold tracking-wide border-[1.5px] border-icgk-gold transition duration-200;
    }
    .btn-primary {
      @apply bg-icgk-gold text-icgk-green-dark hover:bg-icgk-gold-bright hover:-translate-y-0.5 hover:shadow-[0_8px_24px_rgba(212,166,74,0.3)];
    }
    .btn-ghost {
      @apply text-icgk-gold-bright hover:bg-icgk-gold/15 hover:-translate-y-0.5;
    }
    .archive-card {
      @apply flex flex-col bg-black/[0.28] border-[1.5px] border-icgk-gold rounded-2xl overflow-hidden transition duration-200 hover:-translate-y-1 hover:border-icgk-gold-bright hover:shadow-[0_12px_30px_rgba(0,0,0,0.4)];
    }
    .archive-card .flyer { @apply bg-black flex items-center justify-center; }
    .archive-card .flyer img { @apply block w-full h-auto max-h-[420px] object-contain; }
    .archive-card .body { @apply px-5.5 pt-5 pb-5.5; }
    .archive-card .eyebrow { @apply text-icgk-gold-bright tracking-[2px] uppercase text-[0.72rem]; }
    .archive-card h3 { @apply text-icgk-gold text-[1.3rem] mt-1 mb-1.5; }
    .archive-card .when { @apply text-icgk-cream text-[0.95rem] mb-1; }
    .archive-card .where { @apply text-icgk-muted text-[0.9rem]; }
    .archive-card .blurb { @apply text-icgk-text mt-2.5 text-[0.95rem]; }
  }
</style>
</head>
<body class="font-serif text-icgk-text min-h-screen leading-[1.65] bg-fixed px-4 pt-6 pb-16 bg-[radial-gradient(1200px_600px_at_50%_-10%,rgba(212,166,74,0.10),transparent_60%),linear-gradient(135deg,#0c2a1f_0%,#11402f_100%)]">
<div class="max-w-[1000px] mx-auto">

  <a class="inline-block mb-4.5 text-icgk-gold-bright no-underline text-[0.92rem] tracking-wide hover:text-icgk-gold" href="index.html">← Back to Home</a>

  <header class="relative text-center px-5 pt-10 pb-7.5 border-2 border-icgk-gold rounded-2xl mb-7 overflow-hidden bg-[radial-gradient(600px_300px_at_50%_0%,rgba(212,166,74,0.12),transparent_70%),rgba(0,0,0,0.28)] before:content-[''] before:absolute before:inset-2 before:border before:border-icgk-gold/35 before:rounded-xl before:pointer-events-none">
    <div class="text-[2.4rem] leading-none drop-shadow-[0_0_12px_rgba(240,198,116,0.5)]">📜</div>
    <div class="text-icgk-gold-bright text-[0.9rem] tracking-[4px] uppercase mt-2">Archive</div>
    <h1 class="text-icgk-gold text-[2.4rem] mt-1.5 mb-1 drop-shadow-[0_2px_18px_rgba(0,0,0,0.4)]">Past Events</h1>
    <div class="text-icgk-cream italic mt-1">Looking back at our community gatherings</div>
  </header>

  <div id="archive-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  <div id="empty-state" class="text-center px-6 py-15 border-[1.5px] border-dashed border-icgk-gold/50 rounded-2xl text-icgk-muted" hidden>
    <span class="text-[2.4rem] block mb-2.5 text-icgk-gold">🌙</span>
    <h2 class="text-icgk-gold-bright text-[1.3rem] mb-1.5">No past events yet</h2>
    <p>Events will appear here automatically after they conclude.</p>
  </div>

  <div class="text-center mt-7.5">
    <a class="btn btn-primary" href="index.html#events">See upcoming events →</a>
    <a class="btn btn-ghost" href="index.html">← Home</a>
  </div>

  <footer class="text-center text-icgk-muted px-4 pt-7 pb-1 text-[0.9rem] mt-7.5">
    <span class="text-icgk-gold-bright text-[1.05rem] tracking-[2px] block mb-1.5">Islamic Community of Greater Killeen</span>
    <div>May Allah accept from us and from you. 🤲</div>
  </footer>

</div>

<script src="events-data.js"></script>
<script>
  (function () {
    var list = document.getElementById("archive-list");
    var empty = document.getElementById("empty-state");
    var archived = window.ICGK_getArchivedEvents();
    if (!archived.length) {
      list.hidden = true;
      empty.hidden = false;
      return;
    }
    list.innerHTML = archived.map(function (ev) {
      var when = window.ICGK_formatEventDate(ev);
      return '' +
        '<article class="archive-card">' +
          (ev.image ? '<div class="flyer"><img src="' + ev.image + '" alt="' + (ev.imageAlt || ev.title) + '"></div>' : '') +
          '<div class="body">' +
            '<div class="eyebrow">Past Event</div>' +
            '<h3>' + ev.title + '</h3>' +
            '<div class="when">📅 ' + when.date + '</div>' +
            (ev.location ? '<div class="where">📍 ' + ev.location + '</div>' : '') +
            (ev.blurb ? '<div class="blurb">' + ev.blurb + '</div>' : '') +
          '</div>' +
        '</article>';
    }).join("");
  })();
</script>
</body>
</html>
