<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Islamic Community of Greater Killeen</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .btn-404 {
    clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(32px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin-slow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes pulse-glow {
    0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
  }
  .animate-fadeUp { animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .animate-spin-slow { animation: spin-slow 30s linear infinite; }
  .animate-pulse-glow { animation: pulse-glow 5s ease-in-out infinite; }
  .num-404 {
    font-family: 'Cinzel', serif;
    font-size: clamp(6rem, 18vw, 10rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, #f0c674 0%, #d4a64a 50%, #a07830 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  @media (prefers-reduced-motion: reduce) {
    .animate-pulse-glow, .animate-spin-slow, .animate-fadeUp { animation: none !important; }
  }
</style>
</head>
<body class="font-lato text-icgk-text min-h-screen overflow-x-hidden flex flex-col items-center justify-center px-4 py-6 relative bg-[radial-gradient(1200px_600px_at_50%_-10%,rgba(212,166,74,0.10),transparent_60%),linear-gradient(135deg,#0c2a1f_0%,#11402f_100%)]">

<div class="fixed inset-0 w-full h-full pointer-events-none z-0 opacity-[0.16]">
<svg id="geo-canvas" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="100%" height="100%">
  <defs>
    <pattern id="stars" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <polygon points="40,4 56,14 70,28 76,46 70,62 56,72 40,76 24,72 10,62 4,46 10,28 24,14" fill="none" stroke="#d4a64a" stroke-width="0.8"/>
      <polygon points="40,14 45,30 60,30 48,40 52,56 40,47 28,56 32,40 20,30 35,30" fill="none" stroke="#d4a64a" stroke-width="0.6"/>
      <circle cx="40" cy="40" r="2" fill="#d4a64a" opacity="0.5"/>
    </pattern>
    <pattern id="lattice" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <polygon points="20,2 38,20 20,38 2,20" fill="none" stroke="#d4a64a" stroke-width="0.5"/>
      <line x1="20" y1="2" x2="20" y2="38" stroke="#d4a64a" stroke-width="0.3"/>
      <line x1="2" y1="20" x2="38" y2="20" stroke="#d4a64a" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#stars)"/>
  <rect width="100%" height="100%" fill="url(#lattice)" opacity="0.35"/>
</svg>
</div>

<div class="animate-pulse-glow fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] max-w-screen max-h-screen bg-[radial-gradient(circle,rgba(212,166,74,0.18),transparent_70%)] pointer-events-none z-1"></div>

<main class="relative z-10 text-center px-4 max-w-[680px] w-full animate-fadeUp">

  <div class="flex justify-center mb-4 animate-spin-slow" aria-hidden="true">
    <svg width="52" height="52" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#d4a64a" stroke-width="1.5">
        <rect x="11" y="11" width="30" height="30" transform="rotate(0 26 26)"/>
        <rect x="11" y="11" width="30" height="30" transform="rotate(45 26 26)"/>
        <circle cx="26" cy="26" r="5" fill="#d4a64a" opacity="0.6"/>
      </g>
    </svg>
  </div>

  <div class="num-404 mb-1">404</div>

  <div class="flex items-center justify-center gap-4 my-4 max-w-[340px] mx-auto" aria-hidden="true">
    <div class="flex-1 h-px bg-gradient-to-r from-transparent via-icgk-gold to-transparent"></div>
    <span class="text-icgk-gold text-[1.4rem] leading-none">✦</span>
    <div class="flex-1 h-px bg-gradient-to-r from-transparent via-icgk-gold to-transparent"></div>
  </div>

  <div lang="ar" dir="rtl" class="font-amiri text-[1.6rem] text-icgk-gold-bright mb-2 tracking-wider">الصفحة غير موجودة</div>

  <h1 class="font-cinzel text-[clamp(1.2rem,3vw,1.6rem)] font-semibold text-icgk-cream tracking-widest uppercase mb-4">Page Not Found</h1>

  <p class="text-base font-light text-icgk-muted leading-[1.75] max-w-[440px] mx-auto mb-8">
    The page you are looking for may have been moved, renamed, or no longer exists.
    Return to the ICGK homepage and we will guide you from there, in shā' Allāh.
  </p>

  <div class="flex flex-col items-center gap-[1.1rem]">
    <a class="btn-404" href="/">Return Home</a>
    <a class="link-soft" href="/#prayer">View Prayer Times →</a>
  </div>

</main>

<div class="font-cinzel text-[0.7rem] tracking-widest text-icgk-gold/55 uppercase text-center max-w-[90%] fixed bottom-6 left-1/2 -translate-x-1/2 z-10 animate-fadeUp" style="animation-delay: 0.4s;">
  Islamic Community of Greater Killeen &nbsp;·&nbsp; ICGK
</div>

</body>
</html>
