<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Islamic Community of Greater Killeen</title>
<meta name="robots" content="noindex">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-config.js"></script>
<style type="text/tailwindcss">
  @layer components {
    .btn {
      @apply inline-flex items-center gap-2 px-6 py-3 rounded-full no-underline text-base font-bold tracking-wide border-[1.5px] border-icgk-gold transition duration-200;
    }
    .btn-primary {
      @apply bg-icgk-gold text-icgk-green-dark hover:bg-icgk-gold-bright hover:-translate-y-0.5;
    }
    .btn-ghost {
      @apply text-icgk-gold-bright hover:bg-icgk-gold/15 hover:-translate-y-0.5;
    }
  }
</style>
</head>
<body class="font-serif text-icgk-text min-h-screen bg-fixed px-6 py-6 flex items-center justify-center text-center bg-[radial-gradient(1200px_600px_at_50%_-10%,rgba(212,166,74,0.10),transparent_60%),linear-gradient(135deg,#0c2a1f_0%,#11402f_100%)]">
  <div class="relative max-w-[560px] bg-black/[0.28] border-2 border-icgk-gold rounded-[18px] px-[2.125rem] py-[3.25rem] overflow-hidden before:content-[''] before:absolute before:inset-2 before:border before:border-icgk-gold/35 before:rounded-xl before:pointer-events-none">
    <div class="text-7xl drop-shadow-[0_0_14px_rgba(240,198,116,0.4)] relative z-10">🤲</div>
    <div dir="rtl" class="text-icgk-gold-bright text-[1.7rem] my-3">جَزَاكُمُ ٱللَّٰهُ خَيْرًا</div>
    <h1 class="text-icgk-gold text-[2.1rem] my-2.5 relative z-10">Thank You!</h1>
    <p class="text-icgk-cream text-[1.12rem] leading-[1.6] mb-7 relative z-10">Your message has been received. In shā' Allāh, someone from the Islamic Community of Greater Killeen will get back to you soon.</p>
    <div class="flex gap-3.5 justify-center flex-wrap relative z-10">
      <a class="btn btn-primary" href="/">← Back to Home</a>
      <a class="btn btn-ghost" href="/#prayer">Prayer Times</a>
    </div>
  </div>
</body>
</html>
