# Netlify configuration — Islamic Community of Greater Killeen
# Static HTML site. CSS is precompiled from Tailwind (see tailwind.config.js /
# src/input.css) into a single styles.css at deploy time. Netlify Forms are
# detected automatically from the data-netlify form in index.html.

[build]
  publish = "."
  command = "npm install && npm run build:css"

# Sensible security headers (these do not affect the external widgets/maps
# this site embeds — they only apply to our own responses).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
